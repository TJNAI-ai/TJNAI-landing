# Cloudflare Workers (Free plan). Deploy with: npx wrangler@latest deploy
# NOT DEPLOYED. See README.md before running anything.
name = "tob-newsletter"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true          # serves at https://tob-newsletter.<account>.workers.dev (no DNS change needed)

[vars]
ALLOWED_ORIGIN = "https://tjnai.ai"
FROM_ADDRESS = "Tim <tim@tjnai.ai>"
REPLY_TO = "info@tjnai.ai"
SEGMENT_ID = "11b0fc63-f246-4274-b0f3-66165e61d9d7"   # Resend segment "Team of Bots"
TOPIC_ID = "9f9bbe91-987a-4517-b208-5cc0a3640a29"     # Resend topic "Team of Bots weekly" (opt_out default)
# Set after the first deploy to the Worker's own URL (used to build confirm links):
PUBLIC_BASE_URL = "https://tob-newsletter.REPLACE-ME.workers.dev"

# Secrets (never in this file): RESEND_API_KEY, SIGNING_SECRET
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put SIGNING_SECRET

# Basic rate limiting (Workers Rate Limiting API; approximate, per Cloudflare location).
[[ratelimits]]
name = "RL_IP"
namespace_id = "4101"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "RL_EMAIL"
namespace_id = "4102"
  [ratelimits.simple]
  limit = 1
  period = 60
