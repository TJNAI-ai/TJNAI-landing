# Clickwrap acceptance log for tjnai.ai (Cloudflare Workers Free + D1 Free).
# Deployed 2026-11-14 (Workers Free, $0) at https://tjnai-acceptance.tjnai.workers.dev; see README.md.
name = "tjnai-acceptance"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true          # would serve at https://tjnai-acceptance.<account>.workers.dev (no DNS change)

[vars]
# Comma-separated list of origins allowed to POST /accept.
ALLOWED_ORIGIN = "https://tjnai.ai"

# Secret (never in this file), only needed for the read-only re-acceptance check:
#   npx wrangler secret put ADMIN_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "tjnai-acceptance"
# Created 2026-11-14 on the free account with jurisdiction "us" (data stays in the United States).
database_id = "54481a57-4bb3-4e4e-b1cd-61bdafa17831"
migrations_dir = "migrations"

# Basic abuse protection (Workers Rate Limiting API; approximate, per Cloudflare location).
[[ratelimits]]
name = "RL_IP"
namespace_id = "4201"
  [ratelimits.simple]
  limit = 10
  period = 60

# Preview copy for the relaunch preview site only. Separate Worker and separate D1 (v2: recreated Nov 14, 2026 after the
# PRIV-v1.0 re-freeze; the first preview D1 pins the old hash and is unused), so test acceptances
# never land in the real (append-only) log.  Deploy: npx wrangler deploy --env preview
[env.preview]
name = "tjnai-acceptance-preview"
workers_dev = true
[env.preview.vars]
ALLOWED_ORIGIN = "https://tjnai-relaunch-preview.tjnai.workers.dev"
[[env.preview.d1_databases]]
binding = "DB"
database_name = "tjnai-acceptance-preview-v2"
database_id = "ef1c803f-f67e-4897-99c3-5b5de5c916dd"
migrations_dir = "migrations"
[[env.preview.ratelimits]]
name = "RL_IP"
namespace_id = "4202"
  [env.preview.ratelimits.simple]
  limit = 10
  period = 60
